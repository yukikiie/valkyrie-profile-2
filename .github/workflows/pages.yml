name: Publish Silmeria guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source data
        run: node scripts/audit.cjs
      - name: Verify maps, treasure positions and regional encounters
        run: node scripts/audit-locations.cjs --require-locations
      - name: Verify town rewards, merchant recipes and material sources
        run: node scripts/audit-town-items.cjs
      - name: Build static and single-file editions
        run: node scripts/build.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
